plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jarvis.lite'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jarvis.lite'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // Mantém o bytecode Java/Kotlin compatível com a configuração existente.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}
